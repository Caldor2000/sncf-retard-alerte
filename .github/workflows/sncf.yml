name: Surveillance retards SNCF

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  surveillance:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install requests protobuf gtfs-realtime-bindings

      - name: Surveiller les trains
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python sncf_monitor.py

      - name: Sauvegarder la mémoire des retards
        run: |
          git config user.name "SNCF Alert Bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Mise à jour des retards"
          git push