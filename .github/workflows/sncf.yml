name: Surveillance retards SNCF

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sncf-monitor
  cancel-in-progress: false

jobs:
  surveillance:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install requests protobuf gtfs-realtime-bindings

      - name: Surveiller les trains
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python sncf_monitor.py

      - name: Sauvegarder la mémoire des retards
        run: |
          git config user.name "SNCF Alert Bot"
          git config user.email "actions@github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "Aucun changement dans state.json"
            exit 0
          fi

          git commit -m "Mise à jour des retards"

          for i in 1 2 3 4 5
          do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Push réussi"
              exit 0
            fi

            echo "Push échoué, nouvelle tentative..."
            sleep 2
          done

          echo "Impossible de pousser après 5 tentatives"
          exit 1